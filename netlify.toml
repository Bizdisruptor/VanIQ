[build]
  base    = "van-builder-starter"
  command = "npm run build"
  publish = "dist"

# Serve the Framingtool static file directly from the repo root,
# BEFORE the SPA catch-all redirect grabs it.
[[redirects]]
  from = "/Framingtool/*"
  to   = "https://raw.githubusercontent.com/Bizdisruptor/VanIQ/main/Framingtool/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
